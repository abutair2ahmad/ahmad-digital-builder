name: Instagram Autopost

on:
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 12 * * *"
    - cron: "30 17 * * *"
    - cron: "0 8 * * *"
    - cron: "0 13 * * *"
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Create env
        run: |
          cat > ../.env <<EOF
          INSTAGRAM_MOVEWELL_IG_ID=${{ secrets.INSTAGRAM_MOVEWELL_IG_ID }}
          INSTAGRAM_MOVEWELL_TOKEN=${{ secrets.INSTAGRAM_MOVEWELL_TOKEN }}
          INSTAGRAM_BYNEXORA_IG_ID=${{ secrets.INSTAGRAM_BYNEXORA_IG_ID }}
          INSTAGRAM_BYNEXORA_TOKEN=${{ secrets.INSTAGRAM_BYNEXORA_TOKEN }}
          IG_PUBLISH_ENABLED=true
          INSTAGRAM_GRAPH_HOST=graph.instagram.com
          IMAGE_HOST=r2
          R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET=nexora-instagram
          R2_PUBLIC_BASE_URL=${{ secrets.R2_PUBLIC_BASE_URL }}
          EOF

      - name: Run due posts
        run: |
          chmod +x bin/igpost
          bin/igpost due --live

      - name: Commit publishing ledger
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "Update Instagram publishing ledger"
          git push


name: Instagram auto-publisher

# Cron here is UTC and cannot follow Israeli daylight saving, so each of the three
# slots is scheduled at BOTH of its possible UTC times. The runner re-checks the
# real Jerusalem clock and does nothing on the half of each pair that is not
# actually due, which makes the schedule DST-correct without a server.
#
#   10:00 Jerusalem -> 07:00 UTC (summer) / 08:00 UTC (winter)
#   15:00 Jerusalem -> 12:00 UTC (summer) / 13:00 UTC (winter)
#   20:30 Jerusalem -> 17:30 UTC (summer) / 18:30 UTC (winter)
on:
  schedule:
    - cron: "0 7,8,12,13 * * *"
    - cron: "30 17,18 * * *"
    - cron: "45 8,13,18 * * *"   # catch-up pass, inside the 90-minute window
  workflow_dispatch:
    inputs:
      live:
        description: "Publish for real (otherwise dry run)"
        type: boolean
        default: false
      brand:
        description: "Brand for a targeted retry"
        type: choice
        options:
          - movewell
          - bynexora
        default: movewell
      date:
        description: "Date for a targeted retry (YYYY-MM-DD)"
        type: string
        required: false
      slot:
        description: "Slot for a targeted retry"
        type: choice
        options:
          - "10:00"
          - "15:00"
          - "20:30"
        default: "10:00"

concurrency:
  group: instagram-autopost      # never two publishing runs at once
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write            # to commit the publishing ledger back
    steps:
      - uses: actions/checkout@v4

      - name: Install rendering fonts
        # Chrome ships with the runner; the Hebrew and Latin faces do not.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core fonts-inter || \
            sudo apt-get install -y -qq fonts-noto-core

      - name: Write .env from secrets
        run: |
          cat > .env <<'ENVEOF'
          INSTAGRAM_MOVEWELL_IG_ID=${{ secrets.INSTAGRAM_MOVEWELL_IG_ID }}
          INSTAGRAM_MOVEWELL_TOKEN=${{ secrets.INSTAGRAM_MOVEWELL_TOKEN }}
          INSTAGRAM_BYNEXORA_IG_ID=${{ secrets.INSTAGRAM_BYNEXORA_IG_ID }}
          INSTAGRAM_BYNEXORA_TOKEN=${{ secrets.INSTAGRAM_BYNEXORA_TOKEN }}
          INSTAGRAM_GRAPH_HOST=${{ secrets.INSTAGRAM_GRAPH_HOST }}
          IG_PUBLISH_ENABLED=true
          IMAGE_HOST=r2
          R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET=${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL=${{ secrets.R2_PUBLIC_BASE_URL }}
          ENVEOF

      - name: Run whatever is due
        run: |
          cd instagram-autopost
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.date }}" ]; then
            ./bin/igpost --env ../.env run --brand "${{ inputs.brand }}" --date "${{ inputs.date }}" --slot "${{ inputs.slot }}" --live
          elif [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.live }}" = "true" ]; then
            ./bin/igpost --env ../.env due --live
          else
            ./bin/igpost --env ../.env due
          fi

      - name: Remove credentials before anything else runs
        if: always()
        run: rm -f .env

      - name: Commit the publishing ledger
        # The ledger is what prevents a duplicate post on the next run, so it has
        # to outlive the runner. It contains no secrets.
        if: always()
        run: |
          git config user.name "igpost bot"
          git config user.email "noreply@github.com"
          git add -f instagram-autopost/state/ || true
          git diff --staged --quiet || git commit -m "chore: publishing ledger $(date -u +%FT%TZ)"
          git push || true

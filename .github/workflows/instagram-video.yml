name: Instagram Reels and Stories

on:
  schedule:
    # Run at 11:00 Asia/Jerusalem across both DST offsets; the guard below
    # skips the duplicate half of the pair.
    - cron: "0 8,9 * * *"
  workflow_dispatch:
    inputs:
      live:
        description: "Publish for real (otherwise dry run)"
        type: boolean
        default: false

concurrency:
  group: instagram-video
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the active DST trigger
        id: trigger
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(TZ=Asia/Jerusalem date +%H)" != "11" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install video dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-inter || \
            sudo apt-get install -y -qq ffmpeg fonts-noto-core

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Write .env from secrets
        run: |
          cat > .env <<'ENVEOF'
          INSTAGRAM_MOVEWELL_IG_ID=${{ secrets.INSTAGRAM_MOVEWELL_IG_ID }}
          INSTAGRAM_MOVEWELL_TOKEN=${{ secrets.INSTAGRAM_MOVEWELL_TOKEN }}
          INSTAGRAM_GRAPH_HOST=${{ secrets.INSTAGRAM_GRAPH_HOST }}
          IG_PUBLISH_ENABLED=true
          IMAGE_HOST=r2
          R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET=${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL=${{ secrets.R2_PUBLIC_BASE_URL }}
          SHOPIFY_STORE_DOMAIN=${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ADMIN_API_TOKEN=${{ secrets.SHOPIFY_ADMIN_API_TOKEN }}
          SHOPIFY_API_VERSION=${{ secrets.SHOPIFY_API_VERSION }}
          ENVEOF

      - name: Render one real product video
        if: steps.trigger.outputs.run == 'true'
        run: |
          cd instagram-autopost
          ./bin/igstory --env ../.env test --brand movewell
          VIDEO=$(find out/movewell/stories-test -type f -name story.mp4 -print -quit)
          test -n "$VIDEO"
          echo "VIDEO=$VIDEO" >> "$GITHUB_ENV"

      - name: Publish Reel and Story
        if: steps.trigger.outputs.run == 'true' && (github.event_name == 'schedule' || inputs.live == true)
        run: |
          cd instagram-autopost
          ./bin/igstory --env ../.env publish --brand movewell --media-type REELS --video "$VIDEO" --caption "MoveWell"
          ./bin/igstory --env ../.env publish --brand movewell --media-type STORIES --video "$VIDEO"

      - name: Remove credentials
        if: always()
        run: rm -f .env

      - name: Commit video ledger
        if: always()
        run: |
          git config user.name "igpost bot"
          git config user.email "noreply@github.com"
          git add -f instagram-autopost/state/ || true
          git diff --staged --quiet || git commit -m "chore: update video publishing ledger"
          git push || true

<!doctype html>
<html><head><meta charset="utf-8"><title>NEXORA grid preview</title>
<style>
  body { margin:0; background:#0b0f0e; font-family: system-ui, sans-serif; }
  .wrap { width: 1080px; padding: 24px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
  .grid img { width: 100%; display: block; }
  .cap { color:#7d8783; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; padding: 0 0 14px; }
</style></head>
<body><div class="wrap">
  <div class="cap">Profile grid — newest first (post 09 top-left)</div>
  <div class="grid">
    <img src="out/nexora-post-09.png"><img src="out/nexora-post-08.png"><img src="out/nexora-post-07.png">
    <img src="out/nexora-post-06.png"><img src="out/nexora-post-05.png"><img src="out/nexora-post-04.png">
    <img src="out/nexora-post-03.png"><img src="out/nexora-post-02.png"><img src="out/nexora-post-01.png">
  </div>
</div></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>NEXORA — 02</title>
<link rel="stylesheet" href="brand.css">
<style>
  .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 30px; }
  .headline { max-width: 15ch; margin-top: 30px; }
  .stage {
    position: relative;
    margin-top: auto;
    margin-bottom: 8px;
  }
  .laptop { width: 100%; }
  .laptop__lid { width: 866px; }
  .laptop__screen { background-image: url('shots/oriva-hero-desktop.jpg'); }
  .laptop__base { width: 934px; }
  .tagrow { display: flex; gap: 12px; margin-top: 26px; }
</style></head>
<body>
<div class="post">
  <div class="glow glow--a"></div>
  <div class="glow glow--b"></div>
  <div class="mesh"></div>

  <div class="layer">
    <div class="head">
      <div>
        <span class="eyebrow"><span class="num">02</span> Custom Websites</span>
        <h1 class="headline">Websites that move<br>businesses <span class="grad">forward.</span></h1>
      </div>
      <span class="chip chip--accent"><span class="dot"></span>Live build</span>
    </div>

    <div class="tagrow">
      <span class="chip">Design</span>
      <span class="chip">Front-end</span>
      <span class="chip">Performance</span>
      <span class="chip">Mobile-first</span>
    </div>

    <div class="stage" style="padding-bottom:6px;">
      <div class="laptop">
        <div class="laptop__lid"><div class="laptop__screen shot"></div></div>
        <div class="laptop__base"></div>
        <div class="laptop__notch"></div>
      </div>
    </div>

    <div class="foot">
      <span class="caption">ORIVA — Skin &amp; Laser Clinic</span>
      <span class="wordmark wordmark--muted">NEXORA</span>
    </div>
  </div>
</div>
</body></html>

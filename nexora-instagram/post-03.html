<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>NEXORA — 03</title>
<link rel="stylesheet" href="brand.css">
<style>
  .grid { display: flex; gap: 46px; flex: 1; align-items: flex-start; }
  .col-l { flex: 1; padding-top: 6px; }
  .headline--sm { margin-top: 28px; max-width: 14ch; font-size: 58px; }
  .lede { margin-top: 26px; max-width: 23ch; font-size: 24px; }
  .tags { display: flex; flex-wrap: wrap; gap: 11px; margin-top: 32px; max-width: 520px; }
  .tags .chip { font-size: 16px; padding: 9px 18px; }

  .phone { width: 336px; margin-top: 2px; flex: none; }
  .phone__screen { height: 700px; }
  .phone__screen .shot {
    width: 100%; height: 100%;
    background-image: url('shots/oriva-wizard-mobile-slots.png');
    background-position: center top;
  }

  .detail {
    position: absolute;
    left: 72px; bottom: 172px;
    width: 560px; height: 162px;
    background-image: url('shots/oriva-wizard-desktop-date.png');
    background-size: 1662px auto;
    background-position: -190px -537px;
    background-repeat: no-repeat;
  }
  .detail__tag {
    position: absolute;
    left: 72px; bottom: 352px;
    font-size: 16px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
  }
</style></head>
<body>
<div class="post">
  <div class="glow glow--a"></div>
  <div class="glow glow--b"></div>
  <div class="mesh"></div>

  <div class="layer">
    <div class="grid">
      <div class="col-l">
        <span class="eyebrow"><span class="num">03</span> Booking Systems</span>
        <h1 class="headline--sm">Real slots.<br><span class="grad">No</span> double bookings.</h1>
        <p class="lede">Live slots, working hours and staff rotas — a booking that closes the moment it is taken.</p>
        <div class="tags">
          <span class="chip">Live calendar</span>
          <span class="chip">Staff rotas</span>
          <span class="chip">Confirmations</span>
        </div>
      </div>

      <div class="phone">
        <div class="phone__screen">
          <div class="phone__notch"></div>
          <div class="shot"></div>
        </div>
      </div>
    </div>

    <span class="detail__tag">Live availability — UI detail</span>
    <div class="detail"></div>

    <div class="foot">
      <span class="caption">ORIVA — booking engine</span>
      <span class="wordmark wordmark--muted">NEXORA</span>
    </div>
  </div>
</div>
</body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>NEXORA — 04</title>
<link rel="stylesheet" href="brand.css">
<style>
  .post { padding: 64px 72px 72px; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .browser { margin-top: 30px; height: 470px; }
  .browser__view {
    height: 424px;
    background-image: url('shots/nacre-booking-desktop.png');
    background-size: 100% auto;
    background-position: center -8px;
    background-repeat: no-repeat;
  }
  .headline--sm { margin-top: 46px; max-width: 17ch; }
  .steps { display: flex; align-items: center; gap: 10px; margin-top: 30px; flex-wrap: wrap; }
  .step {
    font-size: 16px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px;
  }
  .step--on { color: var(--accent); border-color: rgba(127,203,172,0.42); background: rgba(127,203,172,0.07); }
  .arrow { color: #3a4643; font-size: 15px; }
</style></head>
<body>
<div class="post">
  <div class="glow glow--a"></div>
  <div class="glow glow--b"></div>
  <div class="mesh"></div>

  <div class="layer">
    <div class="top">
      <span class="eyebrow"><span class="num">04</span> Web Applications</span>
      <span class="chip">7-step flow · server validated</span>
    </div>

    <div class="browser">
      <div class="browser__bar">
        <span class="browser__dot"></span><span class="browser__dot"></span><span class="browser__dot"></span>
        <span class="browser__url">nacre.clinic / booking</span>
      </div>
      <div class="browser__view"></div>
    </div>

    <h1 class="headline--sm">From idea to<br><span class="grad">digital product.</span></h1>

    <div class="steps">
      <span class="step step--on">Treatment</span><span class="arrow">→</span>
      <span class="step">Clinician</span><span class="arrow">→</span>
      <span class="step">Date</span><span class="arrow">→</span>
      <span class="step">Time</span><span class="arrow">→</span>
      <span class="step">Details</span><span class="arrow">→</span>
      <span class="step">Confirmed</span>
    </div>

    <div class="foot">
      <span class="caption">NACRE — booking application</span>
      <span class="wordmark wordmark--muted">NEXORA</span>
    </div>
  </div>
</div>
</body></html>

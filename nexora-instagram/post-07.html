<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>NEXORA — 07</title>
<link rel="stylesheet" href="brand.css">
<style>
  .top { display: flex; align-items: center; justify-content: space-between; }
  .stage { position: relative; flex: 1; margin-top: 22px; }

  .laptop { position: absolute; left: -6px; top: 34px; width: 700px; }
  .laptop__lid { width: 700px; padding: 10px; }
  .laptop__screen { background-image: url('shots/oriva-book-desktop-step2.png'); border-radius: 7px; }
  .laptop__base { width: 756px; }

  .phone { position: absolute; right: 4px; top: 0; width: 268px; }
  .phone__screen { height: 556px; }
  .phone__screen .shot {
    width: 100%; height: 100%;
    background-image: url('shots/oriva-hero-mobile.jpg');
    background-position: center top;
  }
  .phone__notch { width: 86px; height: 22px; top: 10px; }

  .meta { position: absolute; left: 0; bottom: 0; }
  .name { font-size: 66px; font-weight: 600; letter-spacing: 0.06em; direction: ltr; }
  .type { margin-top: 10px; font-size: 21px; letter-spacing: 0.06em; color: var(--accent); }
  .desc { margin-top: 16px; font-size: 22px; color: var(--muted); max-width: 30ch; font-weight: 300; line-height: 1.5; }
</style></head>
<body>
<div class="post">
  <div class="glow glow--a"></div>
  <div class="glow glow--b"></div>
  <div class="mesh"></div>

  <div class="layer">
    <div class="top">
      <span class="eyebrow"><span class="num">07</span> Featured Project</span>
      <span class="chip chip--accent"><span class="dot"></span>Website · Booking · Dashboard</span>
    </div>

    <div class="stage">
      <div class="laptop">
        <div class="laptop__lid"><div class="laptop__screen shot"></div></div>
        <div class="laptop__base"></div>
      </div>

      <div class="phone">
        <div class="phone__screen">
          <div class="phone__notch"></div>
          <div class="shot"></div>
        </div>
      </div>

      <div class="meta">
        <div class="name">ORIVA</div>
        <div class="type">Skin &amp; Laser Clinic — Dubai</div>
        <p class="desc">A clinic site with a live booking engine and the front-desk screen behind it.</p>
      </div>
    </div>

    <div class="foot">
      <span class="caption">Portfolio build</span>
      <span class="wordmark wordmark--muted">NEXORA</span>
    </div>
  </div>
</div>
</body></html>

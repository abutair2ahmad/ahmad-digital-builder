<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>NEXORA — 09</title>
<link rel="stylesheet" href="brand.css">
<style>
  .post {
    background:
      radial-gradient(circle at 82% 8%, rgba(127,203,172,0.42) 0%, rgba(127,203,172,0.12) 34%, transparent 62%),
      linear-gradient(150deg, #2C7A64 0%, #1F5C4A 40%, #123027 74%, #0E1211 100%);
  }
  .ring { position: absolute; border-radius: 50%; border: 1px solid rgba(236,234,227,0.10); }
  .r1 { width: 760px; height: 760px; right: -210px; bottom: -250px; }
  .r2 { width: 1080px; height: 1080px; right: -360px; bottom: -410px; }

  .top { display: flex; align-items: center; justify-content: space-between; }
  .display { margin-top: auto; font-size: 104px; letter-spacing: -0.035em; line-height: 1.03; max-width: 10ch; }
  .sub { margin-top: 28px; font-size: 27px; font-weight: 300; color: var(--muted); max-width: 28ch; }

  .cta {
    margin-top: 46px;
    display: inline-flex; align-items: center; gap: 18px;
    background: linear-gradient(100deg, #A9E0C9 0%, #7FCBAC 55%, #58AC8F 100%);
    color: #0E1211;
    border-radius: 999px; padding: 20px 40px;
    font-size: 27px; font-weight: 600; letter-spacing: 0.03em;
    direction: ltr;
    box-shadow: 0 0 70px -14px rgba(127,203,172,0.55);
  }
  .foot { border-top: 1px solid rgba(236,234,227,0.12); margin-top: 56px; }
</style></head>
<body>
<div class="post">
  <div class="mesh"></div>
  <div class="ring r1"></div>
  <div class="ring r2"></div>

  <div class="layer">
    <div class="top">
      <span class="eyebrow"><span class="num">09</span> Start your project</span>
      <span class="wordmark wordmark--muted">NEXORA</span>
    </div>

    <h1 class="display">Start your<br><span class="grad">project.</span></h1>
    <p class="sub">Websites, web apps, booking systems and dashboards.</p>

    <div><span class="cta">bynexora.co <span>→</span></span></div>

    <div class="foot">
      <span class="caption">DM to start · Design → Build → Launch</span>
      <span class="caption">Built by NEXORA</span>
    </div>
  </div>
</div>
</body></html>
